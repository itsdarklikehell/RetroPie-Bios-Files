# Add a label to PRs that change shell scripts
shell:
  - changed-files:
      - any-glob-to-any-file: '**/*.sh'

# Add a label to PRs that change documentation
documentation:
  - changed-files:
      - any-glob-to-any-file: '**/*.md'

# Add a label to PRs that change workflow files
github-actions:
  - changed-files:
      - any-glob-to-any-file: '.github/workflows/*.yml'
      - any-glob-to-any-file: '.github/workflows/*.yaml'
